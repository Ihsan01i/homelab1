MusicFolder = "/opt/music-brain/music"
DataFolder = "/var/lib/navidrome"
LogLevel = "INFO"
Port = 4533
Address = "0.0.0.0"
ScanInterval = "1m"
SessionTimeout = "72h"
ImageCacheSize = "1GB"
CoverArtPriority = "cover.*, folder.*, embedded"

[Tags.Artist]
Split = [",", ";", "/", " feat. ", " ft. "]

[Scanner]
ArtistSplitExceptions = ["Tyler, The Creator", "Earth, Wind & Fire", "AC/DC"]
ArtistJoiner = ", "

[LastFM]
ApiKey = "YOUR_LASTFM_API_KEY"
Secret = "YOUR_LASTFM_SECRET"
Enabled = false
